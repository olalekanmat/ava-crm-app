# Render blueprint: one web service with a persistent disk for the SQLite database.
services:
  - type: web
    name: ava
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: ava-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
